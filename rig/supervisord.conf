[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:opencode-serve]
command=opencode serve --hostname 127.0.0.1 --port 4096
directory=/workspace
environment=OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS="true"
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:model-auth]
command=node /opt/rig/model-auth.js
priority=20
startsecs=0
autorestart=false
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# The agent bridge is NOT a supervised process any more. It is an MCP server
# that opencode spawns over stdio, configured by bootstrap.js into
# opencode.json's `mcp.kelabo` (docs 16 §7). Its lifetime is the opencode
# session's lifetime, which is the whole point: one agent, one folder, one
# kelabo. Running it here as a daemon would give it a lifetime of its own and
# no session to inject into.
